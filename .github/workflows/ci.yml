name: CI - Full Quality Gates

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

jobs:
  test-unit-and-integration:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tca_test
          POSTGRES_PASSWORD: tca_test_password
          POSTGRES_DB: tca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://tca_test:tca_test_password@localhost:5432/tca_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdC50cmVhc3VyZWNvYXN0LmFpJA
      CLERK_SECRET_KEY: sk_test_dGVzdF9zZWNyZXRfa2V5X2Zvcl9jaQ
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OPENAI_API_KEY: sk-test-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy
      RESEND_API_KEY: re_test_dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma generate
        run: pnpm prisma generate

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h localhost -p 5432 -U tca_test; do
            echo "PostgreSQL not ready yet, waiting..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run database migrations
        run: pnpm prisma migrate deploy

      - name: Verify migration status
        run: pnpm prisma migrate status

      - name: Run preflight checks
        run: pnpm preflight

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run all tests (unit + integration)
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build production bundle
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  test-e2e:
    name: E2E Tests (Smoke + Security)
    runs-on: ubuntu-latest
    needs: test-unit-and-integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tca_test
          POSTGRES_PASSWORD: tca_test_password
          POSTGRES_DB: tca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://tca_test:tca_test_password@localhost:5432/tca_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdC50cmVhc3VyZWNvYXN0LmFpJA
      CLERK_SECRET_KEY: sk_test_dGVzdF9zZWNyZXRfa2V5X2Zvcl9jaQ
      NEXT_PUBLIC_APP_URL: http://localhost:5000
      NEXT_PUBLIC_DEV_BYPASS_AUTH: "true"
      DEV_BYPASS_AUTH: "true"
      PLAYWRIGHT_TEST: "true"
      OPENAI_API_KEY: sk-test-dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy
      RESEND_API_KEY: re_test_dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Prisma generate
        run: pnpm prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U tca_test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        run: pnpm prisma migrate deploy

      - name: Run E2E smoke tests
        run: pnpm test:e2e:smoke

      - name: Run E2E security tests
        run: pnpm test:e2e:security

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/**/*.zip
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint
