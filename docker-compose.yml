version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tca
      POSTGRES_PASSWORD: tca_password
      POSTGRES_DB: tca_dev
    ports:
      - "5432:5432"
    volumes:
      - tca_pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  tca_pgdata:
